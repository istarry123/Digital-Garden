name: ✨ Feature Request
description: 提出新功能、改进建议或体验优化
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请先说明**要解决的问题**，再谈具体方案 —— 这样更容易讨论出更好的实现。

        > 提交前请先搜索现有 Issue，避免重复。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，确认这不是重复建议
          required: true

  - type: textarea
    id: background
    attributes:
      label: 需求背景
      description: 你是在什么场景下产生这个需求的？现状是怎样的？
      placeholder: 例如：我经常用手机阅读文章，但目前移动端……
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 预期解决的问题
      description: 这个需求要解决什么具体问题？不解决会带来什么不便？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望怎么实现？（界面、交互、配置方式等）
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过的其他做法，以及为什么没有选择它们
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: 对现有功能的影响
      description: |
        这个改动可能影响哪些部分？例如：
        - 是否影响现有 URL / 已发布文章链接
        - 是否需要新增依赖
        - 是否影响性能预算、SEO、无障碍或深浅主题
        - 是否需要修改 `src/config/blog.config.ts` 的配置结构
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      description: 你认为这个改动的规模大概是多少？
      options:
        - 仅内容 / 文档
        - 单个组件或页面
        - 涉及多个页面或全站样式
        - 涉及配置结构、构建流程或依赖变更
        - 不确定
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 参考资料
      description: 相关链接、截图、其他项目的实现示例等
    validations:
      required: false

  - type: checkboxes
    id: willing
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意自己提交 PR 来实现这个建议
          required: false
